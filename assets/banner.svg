<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="40%" stop-color="#0e172a" />
      <stop offset="80%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0b1329" />
    </linearGradient>

    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 40px;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-size: 16px;
        fill: #94a3b8;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #e2e8f0;
      }
      .pulse-circle {
        animation: pulse 4s ease-in-out infinite alternate;
      }
      .float-card-1 {
        animation: floatOne 5s ease-in-out infinite alternate;
      }
      .float-card-2 {
        animation: floatTwo 6s ease-in-out infinite alternate;
      }
      .wave-line {
        stroke-dasharray: 8 6;
        animation: dash 20s linear infinite;
      }
      .signal-ping {
        animation: ping 2.5s cubic-bezier(0, 0, 0.2, 1) infinite;
        transform-origin: 955px 72px;
      }
      @keyframes floatOne {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-8px); }
      }
      @keyframes floatTwo {
        0% { transform: translateY(0px); }
        100% { transform: translateY(7px); }
      }
      @keyframes pulse {
        0% { opacity: 0.25; transform: scale(0.95); }
        100% { opacity: 0.55; transform: scale(1.05); }
      }
      @keyframes dash {
        to { stroke-dashoffset: -100; }
      }
      @keyframes ping {
        75%, 100% { transform: scale(2.2); opacity: 0; }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGradient)" />

  <!-- Grid Pattern -->
  <g opacity="0.06" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="200" y1="0" x2="200" y2="360" />
    <line x1="400" y1="0" x2="400" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="800" y1="0" x2="800" y2="360" />
    <line x1="1000" y1="0" x2="1000" y2="360" />
  </g>

  <!-- Ambient Glow Behind Elements -->
  <circle cx="150" cy="80" r="140" fill="url(#glowGrad)" class="pulse-circle" />
  <circle cx="1060" cy="280" r="170" fill="url(#glowGrad)" class="pulse-circle" />

  <!-- Animated WebRTC Network Lines -->
  <g opacity="0.4">
    <path d="M 720 180 Q 860 110 990 190 T 1150 140" fill="none" stroke="#38bdf8" stroke-width="2" class="wave-line" />
    <path d="M 750 220 Q 890 280 1020 200 T 1160 250" fill="none" stroke="#818cf8" stroke-width="2" class="wave-line" />
    <line x1="860" y1="110" x2="890" y2="280" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.4" />
    <line x1="990" y1="190" x2="1020" y2="200" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.5" />
  </g>

  <!-- Floating Dynamic Video Card 1 -->
  <g class="float-card-1">
    <rect x="910" y="45" width="220" height="130" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4" filter="url(#glow)" />
    <circle cx="935" cy="68" r="5" fill="#10b981" />
    <circle cx="935" cy="68" r="8" fill="none" stroke="#10b981" opacity="0.6" class="signal-ping" />
    <text x="950" y="72" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">WebRTC Session</text>
    <rect x="1075" y="60" width="40" height="18" rx="4" fill="#22c55e" fill-opacity="0.2" />
    <text x="1083" y="73" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#4ade80">ACTIVE</text>
    <circle cx="955" cy="118" r="18" fill="#334155" />
    <path d="M 942 131 A 13 13 0 0 1 968 131" fill="#64748b" />
    <!-- Dynamic audio/video waves -->
    <rect x="988" y="118" width="4" height="14" rx="2" fill="#38bdf8" />
    <rect x="996" y="110" width="4" height="22" rx="2" fill="#818cf8" />
    <rect x="1004" y="115" width="4" height="17" rx="2" fill="#38bdf8" />
    <rect x="1012" y="105" width="4" height="27" rx="2" fill="#c084fc" />
    <rect x="1020" y="120" width="4" height="12" rx="2" fill="#818cf8" />
    <rect x="1028" y="112" width="4" height="20" rx="2" fill="#38bdf8" />
    <text x="1042" y="123" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8">Ultra HD</text>
  </g>

  <!-- Floating Dynamic Card 2 -->
  <g class="float-card-2">
    <rect x="830" y="195" width="240" height="120" rx="12" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.4" filter="url(#glow)" />
    <circle cx="855" cy="218" r="5" fill="#818cf8" />
    <text x="870" y="222" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Mesh &amp; SFU Architecture</text>
    <rect x="850" y="238" width="68" height="28" rx="6" fill="#1e1b4b" fill-opacity="0.8" stroke="#4f46e5" stroke-width="1" />
    <text x="860" y="256" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#a5b4fc">🔒 E2EE</text>
    <rect x="926" y="238" width="62" height="28" rx="6" fill="#064e3b" fill-opacity="0.8" stroke="#059669" stroke-width="1" />
    <text x="936" y="256" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#6ee7b7">⚡ SFU</text>
    <rect x="996" y="238" width="60" height="28" rx="6" fill="#4c1d95" fill-opacity="0.8" stroke="#7c3aed" stroke-width="1" />
    <text x="1006" y="256" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#d8b4fe">🎙️ Opus</text>
    <text x="852" y="295" font-family="-apple-system, sans-serif" font-size="11" fill="#64748b">Self-Hosted • Enterprise SaaS</text>
  </g>

  <!-- FOREGROUND CONTENT: Header, Title, Subtitle, Badges (Safe left area) -->
  <g id="foreground-content" transform="translate(60, 0)">
    <!-- Category Pill -->
    <rect x="0" y="44" width="290" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5" />
    <circle cx="14" cy="58" r="5" fill="#38bdf8" />
    <text x="28" y="63" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="0.5">📹 AWESOME VIDEO CONFERENCING</text>

    <!-- Main Title -->
    <text x="0" y="124" fill="url(#titleGradient)" class="title-text">Video Conferencing &amp;</text>
    <text x="0" y="168" fill="url(#titleGradient)" class="title-text">Online Meetings</text>

    <!-- Subtitle -->
    <text x="0" y="210" class="subtitle-text">Curated guide to enterprise SaaS platforms, open-source WebRTC servers,</text>
    <text x="0" y="233" class="subtitle-text">SFU/MCU media routers, interactive virtual classrooms, and meeting SDKs.</text>

    <!-- Meta Highlights Badges -->
    <g transform="translate(0, 265)">
      <!-- Badge 1 -->
      <rect x="0" y="0" width="138" height="32" rx="16" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="18" y="20" class="badge-text">🏢 Top SaaS Tiers</text>
      <!-- Badge 2 -->
      <rect x="150" y="0" width="145" height="32" rx="16" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="166" y="20" class="badge-text">💻 13+ Open-Source</text>
      <!-- Badge 3 -->
      <rect x="307" y="0" width="122" height="32" rx="16" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="323" y="20" class="badge-text">🌐 WebRTC / SFU</text>
      <!-- Badge 4 -->
      <rect x="441" y="0" width="138" height="32" rx="16" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="456" y="20" class="badge-text">📊 Market Metrics</text>
    </g>
  </g>
</svg>